[project]
name = "groundtruth-ai-backend"
version = "0.1.0"
description = "GroundTruth AI backend — FastAPI API + Celery workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pgvector>=0.3.4",
    "redis>=5.0.8",
    "celery>=5.4.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.2",
    "gitpython>=3.1.43",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.2.0",
    "langgraph>=0.2.34",
    "openai>=1.47.0",
    "anthropic>=0.34.2",
    "groq>=0.11.0",
    "sentence-transformers>=3.1.1",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    "psycopg[binary]>=3.2.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
